name: stockpress

services:
  api:
    build:
      context: ./backend
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${API_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: stockpress
      MARIADB_USER: stockpress
      MARIADB_PASSWORD: stockpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      npm_config_cache: /tmp/.npm
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app

volumes:
  db-data:
